<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Padelboard - Pista cenital con fichas tacticas">
  <title>Padelboard - Pista cenital con fichas tacticas</title>
  <!-- Fondo: pizarra azul oscuro -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F1E3A"/>

  <!-- Pista de padel cenital, dentro de safe-zone 80% (52..460) -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Perimetro de la pista -->
    <rect x="96" y="80" width="320" height="352" rx="10" stroke-width="8"/>
    <!-- Linea de red (horizontal en el centro) -->
    <line x1="96" y1="256" x2="416" y2="256" stroke-width="9" stroke-dasharray="14 10"/>
    <!-- Lineas de saque (cuartos) -->
    <line x1="96" y1="160" x2="416" y2="160"/>
    <line x1="96" y1="352" x2="416" y2="352"/>
    <!-- Linea central vertical entre lineas de saque -->
    <line x1="256" y1="160" x2="256" y2="352"/>
  </g>

  <!-- Fichas equipo azul (O) en el lado superior -->
  <g>
    <circle cx="176" cy="128" r="24" fill="#3B82F6" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="336" cy="128" r="24" fill="#3B82F6" stroke="#FFFFFF" stroke-width="5"/>
  </g>

  <!-- Fichas equipo rojo (X) en el lado inferior -->
  <g stroke="#EF4444" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- X izquierda -->
    <line x1="158" y1="366" x2="194" y2="402"/>
    <line x1="194" y1="366" x2="158" y2="402"/>
    <!-- X derecha -->
    <line x1="318" y1="366" x2="354" y2="402"/>
    <line x1="354" y1="366" x2="318" y2="402"/>
  </g>

  <!-- Flecha de movimiento tactico (curva amarilla) -->
  <defs>
    <marker id="arrowYellow1" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FACC15"/>
    </marker>
  </defs>
  <path d="M 200 128 Q 256 220 312 300"
        fill="none" stroke="#FACC15" stroke-width="11" stroke-linecap="round"
        marker-end="url(#arrowYellow1)"/>
</svg>
