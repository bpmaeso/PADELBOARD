<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Padelboard - Triangulo de formacion tactica">
  <title>Padelboard - Triangulo de formacion tactica</title>
  <!-- Fondo azul oscuro -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F1E3A"/>

  <!-- Lineas de la formacion (triangulo) en amarillo, estilo tactico -->
  <g stroke="#FACC15" stroke-width="9" stroke-linecap="round" fill="none">
    <!-- Lados del triangulo -->
    <line x1="256" y1="128" x2="128" y2="368"/>
    <line x1="256" y1="128" x2="384" y2="368"/>
    <line x1="128" y1="368" x2="384" y2="368"/>
  </g>

  <!-- Lineas internas de conexion (rojo) - relacion tactica -->
  <g stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" fill="none">
    <line x1="256" y1="128" x2="256" y2="368"/>
    <line x1="190" y1="248" x2="322" y2="248"/>
  </g>

  <!-- Ficha superior: O blanca con halo -->
  <circle cx="256" cy="128" r="38" fill="#0F1E3A" stroke="#FFFFFF" stroke-width="9"/>
  <circle cx="256" cy="128" r="14" fill="#FFFFFF"/>

  <!-- Ficha inferior izq: O blanca -->
  <circle cx="128" cy="368" r="34" fill="#0F1E3A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="128" cy="368" r="12" fill="#FFFFFF"/>

  <!-- Ficha inferior der: O blanca -->
  <circle cx="384" cy="368" r="34" fill="#0F1E3A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="384" cy="368" r="12" fill="#FFFFFF"/>

  <!-- Numeros pequenos para enfatizar "playbook" -->
  <g fill="#FACC15" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="92" font-size="32">1</text>
    <text x="92" y="420" font-size="32">2</text>
    <text x="420" y="420" font-size="32">3</text>
  </g>
</svg>
