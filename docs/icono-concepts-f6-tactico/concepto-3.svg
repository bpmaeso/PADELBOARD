<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Padelboard - Playbook con flechas tacticas cruzadas">
  <title>Padelboard - Playbook con flechas tacticas cruzadas</title>
  <!-- Fondo azul oscuro -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F1E3A"/>

  <!-- Cuadricula sutil tipo pizarra -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.10">
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="192" y1="80" x2="192" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="320" y1="80" x2="320" y2="432"/>
    <line x1="384" y1="80" x2="384" y2="432"/>
    <line x1="80" y1="144" x2="432" y2="144"/>
    <line x1="80" y1="208" x2="432" y2="208"/>
    <line x1="80" y1="272" x2="432" y2="272"/>
    <line x1="80" y1="336" x2="432" y2="336"/>
    <line x1="80" y1="400" x2="432" y2="400"/>
  </g>

  <defs>
    <marker id="arRed3" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#EF4444"/>
    </marker>
    <marker id="arYel3" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FACC15"/>
    </marker>
    <marker id="arWht3" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Posiciones de los 4 jugadores: O blanco arriba, X rojo abajo -->
  <g>
    <circle cx="160" cy="128" r="22" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="352" cy="128" r="22" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <g stroke="#EF4444" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="142" y1="368" x2="178" y2="404"/>
    <line x1="178" y1="368" x2="142" y2="404"/>
    <line x1="334" y1="368" x2="370" y2="404"/>
    <line x1="370" y1="368" x2="334" y2="404"/>
  </g>

  <!-- Flechas de jugada cruzandose -->
  <!-- Diagonal amarilla (O izq -> abajo der) -->
  <path d="M 178 142 Q 280 240 326 360"
        fill="none" stroke="#FACC15" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="2 0"
        marker-end="url(#arYel3)"/>

  <!-- Diagonal blanca (O der -> abajo izq) -->
  <path d="M 334 142 Q 232 240 186 360"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"
        marker-end="url(#arWht3)"/>

  <!-- Flecha roja corta lateral abajo-izq -->
  <path d="M 160 396 Q 110 320 140 240"
        fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="12 8"
        marker-end="url(#arRed3)"/>

  <!-- Flecha roja corta lateral abajo-der -->
  <path d="M 352 396 Q 402 320 372 240"
        fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="12 8"
        marker-end="url(#arRed3)"/>
</svg>
