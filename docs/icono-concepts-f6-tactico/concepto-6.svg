<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Padelboard - Set play, simbolo tactico abstracto">
  <title>Padelboard - Set play, simbolo tactico abstracto</title>
  <!-- Fondo azul oscuro -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F1E3A"/>

  <!-- Anillo exterior tipo emblema -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.30"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FACC15" stroke-width="6"
          stroke-dasharray="28 18" opacity="0.55"/>

  <!-- X grande roja centrada (jugador / set) -->
  <g stroke="#EF4444" stroke-width="38" stroke-linecap="round" fill="none">
    <line x1="160" y1="160" x2="352" y2="352"/>
    <line x1="352" y1="160" x2="160" y2="352"/>
  </g>

  <!-- Flecha boomerang amarilla que envuelve la X (set play en accion) -->
  <defs>
    <marker id="arBoom6" viewBox="0 0 14 14" refX="9" refY="7" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#FACC15"/>
    </marker>
  </defs>
  <path d="M 130 260
           A 130 130 0 1 1 256 386
           L 256 386"
        fill="none"
        stroke="#FACC15"
        stroke-width="16"
        stroke-linecap="round"
        marker-end="url(#arBoom6)"/>

  <!-- Pequena O blanca como objetivo del set -->
  <circle cx="256" cy="386" r="14" fill="#FFFFFF" opacity="0.0"/>
</svg>
