<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PADELBOARD - diana con pelota centrada">
  <!-- Fondo cuadrado redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F172A"/>

  <!-- Diana concéntrica (círculos outline) dentro del safe-zone (radio max 205) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.7"/>
  <circle cx="256" cy="256" r="96"  fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.55"/>

  <!-- Pelota amarilla centrada -->
  <circle cx="256" cy="256" r="44" fill="#FFD600"/>
</svg>
