<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PADELBOARD - red de padel">
  <!-- Fondo cuadrado redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0EA5E9"/>

  <!-- Postes laterales de la red -->
  <line x1="80" y1="160" x2="80" y2="360"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="432" y1="160" x2="432" y2="360"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Cuerda superior de la red -->
  <line x1="80" y1="200" x2="432" y2="200"
        stroke="#FFFFFF" stroke-width="10"/>
  <!-- Cuerda inferior de la red -->
  <line x1="80" y1="320" x2="432" y2="320"
        stroke="#FFFFFF" stroke-width="10"/>

  <!-- Líneas verticales pequeñas de la malla (geométrico) -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="200" x2="128" y2="320"/>
    <line x1="176" y1="200" x2="176" y2="320"/>
    <line x1="224" y1="200" x2="224" y2="320"/>
    <line x1="272" y1="200" x2="272" y2="320"/>
    <line x1="320" y1="200" x2="320" y2="320"/>
    <line x1="368" y1="200" x2="368" y2="320"/>
  </g>

  <!-- Pelota amarilla saltando sobre la red -->
  <circle cx="256" cy="148" r="32" fill="#FFD600"/>
</svg>
