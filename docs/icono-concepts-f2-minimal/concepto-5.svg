<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PADELBOARD - cuadrante de pista con pelota">
  <!-- Fondo cuadrado redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0F766E"/>

  <!-- Esquina superior derecha de pista (forma de L invertida grande) -->
  <!-- Línea horizontal (línea de fondo) -->
  <line x1="160" y1="160" x2="412" y2="160"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Línea vertical (lateral) -->
  <line x1="412" y1="160" x2="412" y2="412"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Línea de saque interior (paralela a fondo) -->
  <line x1="240" y1="260" x2="412" y2="260"
        stroke="#FFFFFF" stroke-width="8" opacity="0.85"/>
  <!-- División vertical del cuadrante de saque -->
  <line x1="326" y1="260" x2="326" y2="412"
        stroke="#FFFFFF" stroke-width="8" opacity="0.85"/>

  <!-- Trayectoria de pelota (línea discontinua diagonal sutil) -->
  <line x1="120" y1="380" x2="240" y2="280"
        stroke="#FFFFFF" stroke-width="6"
        stroke-linecap="round"
        stroke-dasharray="4 16" opacity="0.7"/>

  <!-- Pelota amarilla en el aire entrando al cuadrante -->
  <circle cx="244" cy="280" r="30" fill="#FFD600"/>
</svg>
