<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bola de padel amarilla esferica con highlight">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2418"/>
      <stop offset="0.5" stop-color="#08321e"/>
      <stop offset="1" stop-color="#031208"/>
    </linearGradient>
    <radialGradient id="bgGlow2" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1d6a3f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#031208" stop-opacity="0"/>
    </radialGradient>

    <!-- Esfera amarilla con sombreado real -->
    <radialGradient id="ballBase" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fff7a8"/>
      <stop offset="0.4" stop-color="#eaef3a"/>
      <stop offset="0.85" stop-color="#9aa414"/>
      <stop offset="1" stop-color="#3c4404"/>
    </radialGradient>
    <radialGradient id="ballHi" cx="0.32" cy="0.22" r="0.28">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballAO" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Costura curva blanca -->
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d4b0"/>
    </linearGradient>

    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Textura fieltro: pequeño ruido radial -->
    <radialGradient id="felt" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow2)"/>

  <!-- Sombra de contacto -->
  <ellipse cx="256" cy="430" rx="150" ry="22" fill="url(#contact)"/>

  <!-- Esfera principal -->
  <circle cx="256" cy="248" r="170" fill="url(#ballBase)"/>
  <circle cx="256" cy="248" r="170" fill="url(#felt)"/>
  <!-- AO inferior -->
  <circle cx="256" cy="248" r="170" fill="url(#ballAO)"/>

  <!-- Costuras (líneas blancas curvas estilo pelota tenis/padel) -->
  <path d="M 100 195 C 180 130 332 130 412 195" stroke="url(#seam)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 100 195 C 180 130 332 130 412 195" stroke="#000" stroke-opacity="0.25" stroke-width="2" fill="none" stroke-linecap="round" transform="translate(0,4)"/>
  <path d="M 100 305 C 180 370 332 370 412 305" stroke="url(#seam)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 100 305 C 180 370 332 370 412 305" stroke="#000" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round" transform="translate(0,-4)"/>

  <!-- Pelusa fieltro: pequeños puntos -->
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="190" cy="180" r="1.5"/>
    <circle cx="210" cy="200" r="1.2"/>
    <circle cx="170" cy="230" r="1.6"/>
    <circle cx="220" cy="245" r="1.2"/>
    <circle cx="250" cy="170" r="1.4"/>
    <circle cx="280" cy="200" r="1.3"/>
    <circle cx="310" cy="230" r="1.5"/>
    <circle cx="200" cy="280" r="1.2"/>
    <circle cx="240" cy="300" r="1.3"/>
    <circle cx="290" cy="280" r="1.4"/>
    <circle cx="330" cy="260" r="1.2"/>
    <circle cx="160" cy="260" r="1.5"/>
  </g>
  <g fill="#000" fill-opacity="0.25">
    <circle cx="195" cy="186" r="1.2"/>
    <circle cx="215" cy="206" r="1"/>
    <circle cx="175" cy="236" r="1.3"/>
    <circle cx="226" cy="252" r="1.1"/>
    <circle cx="256" cy="176" r="1.2"/>
    <circle cx="286" cy="206" r="1.1"/>
    <circle cx="316" cy="236" r="1.2"/>
    <circle cx="206" cy="286" r="1.1"/>
    <circle cx="246" cy="306" r="1.1"/>
    <circle cx="296" cy="286" r="1.2"/>
    <circle cx="336" cy="266" r="1.1"/>
  </g>

  <!-- Highlight superior brillante -->
  <circle cx="256" cy="248" r="170" fill="url(#ballHi)"/>
  <ellipse cx="206" cy="170" rx="32" ry="14" fill="#fff" fill-opacity="0.55" transform="rotate(-25 206 170)"/>
</svg>
