<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pizarra negra con tiza dibujando media pista">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c10"/>
      <stop offset="0.55" stop-color="#1a1108"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="bgGlow4" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#5a3a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a0604" stop-opacity="0"/>
    </radialGradient>

    <!-- Marco de madera -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a3a"/>
      <stop offset="0.4" stop-color="#7a4818"/>
      <stop offset="0.7" stop-color="#5a3208"/>
      <stop offset="1" stop-color="#2a1604"/>
    </linearGradient>
    <linearGradient id="woodHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a868" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d8a868" stop-opacity="0"/>
    </linearGradient>

    <!-- Pizarra -->
    <radialGradient id="board" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1a2418"/>
      <stop offset="0.6" stop-color="#0d140c"/>
      <stop offset="1" stop-color="#040804"/>
    </radialGradient>
    <linearGradient id="boardSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Tiza -->
    <linearGradient id="chalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef0"/>
      <stop offset="0.5" stop-color="#e8e0c0"/>
      <stop offset="1" stop-color="#8a7e54"/>
    </linearGradient>

    <radialGradient id="shadow4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg4)"/>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow4)"/>

  <!-- Sombra de la pizarra -->
  <ellipse cx="256" cy="440" rx="180" ry="20" fill="url(#shadow4)"/>

  <!-- Marco de madera -->
  <rect x="56" y="76" width="400" height="340" rx="22" fill="url(#wood)"/>
  <rect x="56" y="76" width="400" height="80" rx="22" fill="url(#woodHi)"/>

  <!-- Vetas de madera sugeridas -->
  <g stroke="#3a1e08" stroke-opacity="0.55" stroke-width="1" fill="none">
    <path d="M 70 100 Q 250 110 442 100"/>
    <path d="M 70 130 Q 250 140 442 130"/>
    <path d="M 70 380 Q 250 390 442 380"/>
    <path d="M 70 400 Q 250 405 442 400"/>
  </g>

  <!-- Pizarra interior -->
  <rect x="84" y="104" width="344" height="284" rx="10" fill="url(#board)"/>
  <rect x="84" y="104" width="344" height="284" rx="10" fill="url(#boardSheen)"/>

  <!-- Bordes interiores de profundidad -->
  <rect x="84" y="104" width="344" height="284" rx="10" fill="none" stroke="#000" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="86" y="106" width="340" height="280" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Dibujo de tiza: media pista en perspectiva -->
  <g stroke="url(#chalk)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95">
    <!-- Contorno media pista -->
    <path d="M 130 340 L 382 340 L 350 200 L 162 200 Z"/>
    <!-- Linea de saque -->
    <path d="M 175 260 L 337 260"/>
    <!-- Linea central vertical -->
    <path d="M 256 340 L 256 260"/>
    <!-- Red marcada con triangulitos -->
    <path d="M 145 295 L 367 295"/>
    <g stroke-width="2">
      <path d="M 160 295 L 165 285 L 170 295"/>
      <path d="M 200 295 L 205 285 L 210 295"/>
      <path d="M 240 295 L 245 285 L 250 295"/>
      <path d="M 280 295 L 285 285 L 290 295"/>
      <path d="M 320 295 L 325 285 L 330 295"/>
    </g>
  </g>

  <!-- Flecha tactica de jugada -->
  <g stroke="#ffd96a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 195 320 Q 230 240 310 230"/>
    <path d="M 310 230 L 296 220"/>
    <path d="M 310 230 L 302 244"/>
  </g>

  <!-- "X" jugador con tiza -->
  <g stroke="url(#chalk)" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="186" y1="312" x2="204" y2="328"/>
    <line x1="204" y1="312" x2="186" y2="328"/>
  </g>
  <!-- "O" jugador -->
  <circle cx="316" cy="222" r="9" fill="none" stroke="url(#chalk)" stroke-width="3" opacity="0.9"/>

  <!-- Polvo de tiza sutil -->
  <g fill="#fffef0" fill-opacity="0.25">
    <circle cx="200" cy="350" r="1.5"/>
    <circle cx="220" cy="355" r="1.2"/>
    <circle cx="250" cy="358" r="1.8"/>
    <circle cx="290" cy="354" r="1.3"/>
    <circle cx="320" cy="351" r="1.6"/>
    <circle cx="340" cy="356" r="1.2"/>
  </g>

  <!-- Tiza apoyada en bandeja -->
  <g>
    <rect x="100" y="375" width="100" height="14" rx="3" fill="url(#chalk)"/>
    <rect x="100" y="375" width="100" height="5" rx="3" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="100" y="385" width="100" height="4" fill="#000" fill-opacity="0.35"/>
  </g>

  <!-- Reflejo suave superior -->
  <path d="M 100 120 Q 256 132 412 120" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
