<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trofeo dorado con base de marmol">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1228"/>
      <stop offset="0.5" stop-color="#221038"/>
      <stop offset="1" stop-color="#080414"/>
    </linearGradient>
    <radialGradient id="bgGlow5" cx="0.5" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#ffd96a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#080414" stop-opacity="0"/>
    </radialGradient>

    <!-- Oro -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.35" stop-color="#f6c64a"/>
      <stop offset="0.7" stop-color="#a07012"/>
      <stop offset="1" stop-color="#4a2e04"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d0"/>
      <stop offset="0.5" stop-color="#f0b830"/>
      <stop offset="1" stop-color="#5a3a04"/>
    </linearGradient>
    <radialGradient id="goldHi" cx="0.35" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Marmol -->
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ecea"/>
      <stop offset="0.5" stop-color="#c6c0bc"/>
      <stop offset="1" stop-color="#6a6258"/>
    </linearGradient>
    <linearGradient id="marbleTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6f2"/>
      <stop offset="1" stop-color="#b8b2ac"/>
    </linearGradient>

    <radialGradient id="shadow5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor radial dorado -->
    <radialGradient id="rays" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe89a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg5)"/>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow5)"/>

  <!-- Resplandor detras del trofeo -->
  <circle cx="256" cy="200" r="180" fill="url(#rays)"/>

  <!-- Sombra base -->
  <ellipse cx="256" cy="448" rx="170" ry="18" fill="url(#shadow5)"/>

  <!-- BASE marmol (cubo trapezoidal) -->
  <g>
    <!-- Cara frontal -->
    <path d="M 140 400 L 372 400 L 348 450 L 164 450 Z" fill="url(#marble)"/>
    <!-- Cara superior (gris claro) -->
    <path d="M 140 400 L 372 400 L 362 388 L 150 388 Z" fill="url(#marbleTop)"/>
    <!-- Veteado marmol -->
    <g stroke="#7a736a" stroke-opacity="0.45" stroke-width="1" fill="none">
      <path d="M 160 412 Q 220 420 290 414 Q 330 410 360 418"/>
      <path d="M 170 432 Q 240 440 320 434"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" fill="none">
      <path d="M 165 420 Q 230 424 300 420"/>
    </g>
    <!-- Placa dorada -->
    <rect x="200" y="408" width="112" height="26" rx="3" fill="url(#goldRim)"/>
    <rect x="200" y="408" width="112" height="10" rx="3" fill="#ffffff" fill-opacity="0.45"/>
    <text x="256" y="426" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#4a2e04" letter-spacing="2">PADEL</text>
  </g>

  <!-- Pie del trofeo (peana dorada) -->
  <g>
    <path d="M 210 388 L 302 388 L 312 372 L 200 372 Z" fill="url(#gold)"/>
    <rect x="225" y="350" width="62" height="24" fill="url(#gold)"/>
    <rect x="225" y="350" width="62" height="6" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="225" y="370" width="62" height="4" fill="#000" fill-opacity="0.35"/>
    <!-- columna -->
    <rect x="240" y="320" width="32" height="36" fill="url(#gold)"/>
    <rect x="240" y="320" width="9" height="36" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="265" y="320" width="7" height="36" fill="#000" fill-opacity="0.35"/>
  </g>

  <!-- Copa principal -->
  <g>
    <!-- Asas (curvas) -->
    <path d="M 180 180 C 130 180 130 280 195 290" stroke="url(#goldRim)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 332 180 C 382 180 382 280 317 290" stroke="url(#goldRim)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- highlight asas -->
    <path d="M 180 180 C 145 180 142 240 158 270" stroke="#fff8d0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 332 180 C 365 180 368 240 354 270" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.35"/>

    <!-- Cuerpo de la copa -->
    <path d="M 168 150 L 344 150 L 326 310 Q 256 340 186 310 Z" fill="url(#gold)"/>
    <!-- highlight grande -->
    <path d="M 178 156 L 230 156 L 218 305 Q 200 308 188 302 Z" fill="url(#goldHi)"/>
    <!-- sombra derecha -->
    <path d="M 326 156 L 344 156 L 330 296 Q 320 304 314 302 Z" fill="#000" fill-opacity="0.28"/>

    <!-- Borde superior (anillo) -->
    <ellipse cx="256" cy="150" rx="88" ry="22" fill="url(#goldRim)"/>
    <ellipse cx="256" cy="148" rx="80" ry="14" fill="#3a2204"/>
    <ellipse cx="256" cy="146" rx="80" ry="10" fill="url(#gold)" opacity="0.85"/>
    <ellipse cx="246" cy="143" rx="40" ry="4" fill="#ffffff" fill-opacity="0.5"/>

    <!-- Anillo decorativo central -->
    <rect x="180" y="230" width="152" height="10" fill="url(#goldRim)"/>
    <rect x="180" y="230" width="152" height="3" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="180" y="237" width="152" height="3" fill="#000" fill-opacity="0.35"/>

    <!-- Estrella central -->
    <g transform="translate(256 200)">
      <path d="M 0 -22 L 6 -7 L 22 -7 L 9 3 L 14 18 L 0 9 L -14 18 L -9 3 L -22 -7 L -6 -7 Z" fill="#fff8d0" stroke="#a07012" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Brillos pequeños -->
  <g fill="#fff" opacity="0.9">
    <circle cx="200" cy="170" r="3"/>
    <circle cx="205" cy="170" r="1.2"/>
    <circle cx="320" cy="260" r="2.5"/>
  </g>

  <!-- Destellos cruzados -->
  <g stroke="#fff8d0" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="195" y1="160" x2="215" y2="160"/>
    <line x1="205" y1="150" x2="205" y2="170"/>
  </g>
</svg>
