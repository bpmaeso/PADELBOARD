<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Avatar jugador con pala detrás">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="topShine6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="circle6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="paddle6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="grip6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg6)"/>
  <rect x="0" y="0" width="512" height="240" rx="96" fill="url(#topShine6)"/>

  <!-- Disco circular detrás (estilo team icon) -->
  <circle cx="256" cy="280" r="180" fill="url(#circle6)" stroke="#1E1B4B" stroke-width="4" opacity="0.95"/>
  <!-- Highlight superior disco -->
  <path d="M 100 240 Q 256 130 412 240" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>

  <!-- Pala detrás del avatar (rotada) -->
  <g transform="translate(370 170) rotate(35)">
    <!-- Grip -->
    <rect x="-12" y="80" width="24" height="58" rx="8" fill="url(#grip6)" stroke="#0B0F19" stroke-width="2"/>
    <rect x="-16" y="132" width="32" height="10" rx="3" fill="#FBBF24"/>
    <!-- Mango corto -->
    <rect x="-8" y="60" width="16" height="28" rx="3" fill="#1F2937"/>
    <!-- Cabeza -->
    <ellipse cx="0" cy="20" rx="58" ry="62" fill="url(#paddle6)" stroke="#075E70" stroke-width="3"/>
    <!-- Brillo -->
    <ellipse cx="-22" cy="-10" rx="22" ry="14" fill="#FFFFFF" opacity="0.35"/>
    <!-- Agujeros -->
    <g fill="#0E7490" opacity="0.9">
      <circle cx="-22" cy="6" r="4"/>
      <circle cx="0"   cy="0" r="4"/>
      <circle cx="22"  cy="6" r="4"/>
      <circle cx="-14" cy="32" r="4"/>
      <circle cx="14"  cy="32" r="4"/>
      <circle cx="0"   cy="48" r="4"/>
    </g>
  </g>

  <!-- Silueta jugador en blanco -->
  <g fill="#FFFFFF">
    <!-- Cabeza -->
    <circle cx="232" cy="222" r="44"/>
    <!-- Hombros / torso -->
    <path d="M 132 410
             Q 132 320 232 320
             Q 332 320 332 410
             Z"/>
  </g>

  <!-- Sombra suave bajo avatar para profundidad -->
  <ellipse cx="232" cy="412" rx="100" ry="8" fill="#000" opacity="0.18"/>
</svg>
