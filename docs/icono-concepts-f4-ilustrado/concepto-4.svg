<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tablero táctico con pista y lápiz">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="board4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E5E48"/>
      <stop offset="1" stop-color="#073B2D"/>
    </linearGradient>
    <linearGradient id="frame4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="pencil4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shine4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg4)"/>

  <!-- Sombra del tablero -->
  <rect x="88" y="120" width="336" height="296" rx="28" fill="#000" opacity="0.30"/>

  <!-- Marco del tablero -->
  <rect x="80" y="112" width="336" height="288" rx="28" fill="url(#frame4)" stroke="#475569" stroke-width="4"/>
  <!-- Superficie verde -->
  <rect x="104" y="136" width="288" height="240" rx="14" fill="url(#board4)"/>
  <rect x="104" y="136" width="288" height="80" rx="14" fill="url(#shine4)"/>

  <!-- Pista dibujada con tiza/blanco -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Rectángulo pista -->
    <rect x="148" y="172" width="200" height="168" rx="6" opacity="0.95"/>
    <!-- Red horizontal -->
    <line x1="148" y1="256" x2="348" y2="256" opacity="0.9"/>
    <!-- Líneas de servicio -->
    <line x1="180" y1="200" x2="316" y2="200" opacity="0.7"/>
    <line x1="180" y1="312" x2="316" y2="312" opacity="0.7"/>
    <!-- Eje central -->
    <line x1="248" y1="200" x2="248" y2="312" opacity="0.55"/>
  </g>

  <!-- Trayectoria táctica punteada -->
  <path d="M 188 300 Q 248 220 308 300" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <circle cx="308" cy="300" r="6" fill="#FDE047"/>

  <!-- Pinza superior -->
  <rect x="220" y="100" width="72" height="22" rx="6" fill="#94A3B8" stroke="#475569" stroke-width="2"/>

  <!-- Lápiz diagonal -->
  <g transform="translate(355 355) rotate(40)">
    <!-- Cuerpo -->
    <rect x="-90" y="-12" width="140" height="24" rx="4" fill="url(#pencil4)" stroke="#7C2D12" stroke-width="2"/>
    <!-- Bandas -->
    <rect x="40" y="-12" width="10" height="24" fill="#7C2D12"/>
    <rect x="30" y="-12" width="8" height="24" fill="#FDE68A"/>
    <!-- Punta -->
    <polygon points="50,-12 80,0 50,12" fill="#FDE68A" stroke="#7C2D12" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="68,-5 80,0 68,5" fill="#1F2937"/>
    <!-- Goma -->
    <rect x="-104" y="-12" width="16" height="24" rx="4" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
  </g>
</svg>
