<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pista isométrica con flecha de jugada">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3A8A"/>
      <stop offset="1" stop-color="#0F1E4D"/>
    </linearGradient>
    <linearGradient id="court1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB68A"/>
      <stop offset="1" stop-color="#1F8A60"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="shine1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg1)"/>
  <rect x="0" y="0" width="512" height="240" rx="96" fill="url(#shine1)"/>

  <!-- Pista isométrica (rombo) -->
  <g transform="translate(256 280)">
    <!-- Sombra suave -->
    <ellipse cx="0" cy="92" rx="170" ry="22" fill="#000" opacity="0.22"/>
    <!-- Cuerpo pista -->
    <polygon points="0,-80 180,30 0,140 -180,30" fill="url(#court1)" stroke="#0F4E36" stroke-width="4" stroke-linejoin="round"/>
    <!-- Línea media -->
    <line x1="-180" y1="30" x2="180" y2="30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <!-- Línea de servicio superior -->
    <line x1="-100" y1="-25" x2="100" y2="-25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <!-- Línea de servicio inferior -->
    <line x1="-100" y1="85" x2="100" y2="85" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <!-- Centro -->
    <line x1="0" y1="-25" x2="0" y2="85" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Flecha de jugada en arco amarillo -->
  <g fill="none" stroke="url(#arrow1)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150 230 Q 256 90 380 230"/>
  </g>
  <polygon points="380,230 350,205 358,250" fill="#F59E0B"/>
  <!-- Punto inicial -->
  <circle cx="150" cy="230" r="10" fill="#FFD84D" stroke="#F59E0B" stroke-width="3"/>
</svg>
