<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concepto 2 - Monograma "P" con red de padel.
  Viewport 512x512. La barra horizontal de la P se sustituye por la malla romboidal de una red.
  Safe-zone maskable: glifo "P" inscrito en circulo radio 205.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pizarra Pádel - icono concepto 2">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#16223d"/>
    </linearGradient>
    <pattern id="net2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#e9eef7" stroke-width="3"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#e9eef7" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg2)"/>

  <!-- Glifo P estilizado: trazo vertical solido azul, cabeza redondeada con relleno de red -->
  <g transform="translate(170 96)">
    <!-- Trazo vertical de la P (barra izquierda) -->
    <rect x="0" y="0" width="56" height="320" rx="12" fill="#3d8bff"/>
    <!-- Cabeza de la P: semicirculo (en realidad D) con relleno de red -->
    <!-- Outer shape -->
    <path d="M 56 0
             L 130 0
             A 90 90 0 0 1 130 180
             L 56 180
             Z" fill="#3d8bff"/>
    <!-- Inner hueco: rellenado por red. Hueco interior: ofset 22px -->
    <path d="M 56 22
             L 128 22
             A 68 68 0 0 1 128 158
             L 56 158
             Z" fill="url(#net2)"/>
    <!-- Cable superior e inferior de la red (cinta blanca) -->
    <rect x="56" y="14" width="76" height="10" fill="#ffffff"/>
    <rect x="56" y="156" width="76" height="10" fill="#ffffff"/>
    <!-- Poste derecho de la red -->
    <rect x="195" y="6" width="6" height="172" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Acento: bola amarilla bajo la curva de la P -->
  <circle cx="320" cy="332" r="20" fill="#f7d83a" stroke="#7a6300" stroke-width="2"/>
  <ellipse cx="313" cy="325" rx="6" ry="4" fill="#ffffff" opacity="0.55"/>
</svg>
